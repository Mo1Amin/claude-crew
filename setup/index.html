<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crew Setup</title>
<style>
:root {
  --bg: #f6f3ec; --card: #fffdf9; --ink: #1f1e1b; --muted: #6f6a60; --line: #e6e0d4;
  --accent: #d97757; --accent-ink: #a9492a; --on-accent: #fff; --soft: #f3e5dc; --field: #fff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171614; --card: #201f1c; --ink: #f1eee7; --muted: #a39d91; --line: #34322d;
    --accent: #e08a6c; --accent-ink: #f0a78d; --on-accent: #1f1e1b; --soft: #33261f; --field: #191816;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
}
.shell { width: 100%; max-width: 760px; margin: 0 auto; padding: 24px 16px 16px; flex: 1; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
.brand svg { width: 34px; height: 34px; }
.lang { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
ol.steps { list-style: none; display: flex; gap: 6px; padding: 0; margin: 0 0 24px; }
ol.steps li { flex: 1; font-size: 13px; color: var(--muted); padding-top: 8px; border-top: 3px solid var(--line); transition: border-color .2s, color .2s; }
ol.steps li.on { color: var(--ink); border-color: var(--accent); font-weight: 600; }
h1 { font-size: 28px; line-height: 1.25; margin: 0 0 6px; }
.lede { color: var(--muted); margin: 0 0 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
label, .label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.hint { font-size: 13.5px; color: var(--muted); margin: 6px 0 0; }
input[type=text], select {
  width: 100%; font: inherit; color: var(--ink); background: var(--field);
  border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px;
}
input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.looks { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.look { background: var(--field); border: 2px solid var(--line); border-radius: 10px; padding: 4px; cursor: pointer; aspect-ratio: 1; transition: border-color .15s, background .15s; }
.look svg { display: block; width: 100%; height: 100%; }
.look[aria-pressed=true] { border-color: var(--accent); background: var(--soft); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.head strong { font-size: 15px; }
.choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.choice button { text-align: start; background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; font: inherit; cursor: pointer; transition: border-color .15s, background .15s; }
.choice button b { display: block; }
.choice button span { font-size: 13.5px; color: var(--muted); }
.choice button[aria-pressed=true] { border-color: var(--accent); background: var(--soft); }
.agent { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-weight: 600; margin: 0; }
.agent input { margin-top: 5px; accent-color: var(--accent); width: 17px; height: 17px; }
.agent small { display: block; font-weight: 400; color: var(--muted); font-size: 13.5px; }
.sub { margin-top: 12px; }
.btn { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); transition: transform .1s, background .15s; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.quiet { border: none; background: none; color: var(--accent-ink); padding: 4px 6px; font-size: 14px; }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
pre { margin: 10px 0; padding: 10px; background: var(--field); border: 1px solid var(--line); border-radius: 9px; font: 13px/1.6 ui-monospace, Consolas, monospace; direction: ltr; text-align: left; overflow-x: auto; }
textarea { width: 100%; height: 190px; resize: vertical; font: 13px/1.5 ui-monospace, Consolas, monospace; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 9px; padding: 10px; direction: ltr; text-align: left; }
.num { display: inline-flex; width: 24px; height: 24px; border-radius: 50%; background: var(--soft); color: var(--accent-ink); font-size: 13px; font-weight: 700; align-items: center; justify-content: center; margin-inline-end: 8px; }
footer { text-align: center; color: var(--muted); font-size: 13.5px; padding: 18px 16px 24px; }
footer b { color: var(--ink); font-weight: 600; }
footer bdi { unicode-bidi: isolate; }
@media (max-width: 560px) {
  h1 { font-size: 24px; }
  .row, .choice { grid-template-columns: minmax(0, 1fr); }
  .looks { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  ol.steps li { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><span id="brandArt"></span><span id="brandName"></span></div>
    <button class="lang" id="langBtn" type="button"></button>
  </header>
  <ol class="steps" id="steps"></ol>
  <main id="view"></main>
</div>
<footer id="credit"></footer>

<script>
'use strict'
// Filled by the plugin (hooks/setup.ts). Opened from the repository it shows the first look alone.
const CREW = /*CREW_DATA*/null || { crewDir: '~/.claude/crew', config: null, looks: {} }

const LOOKS = ['captain', 'bow', 'cat', 'music', 'helmet', 'hologram', 'pink', 'scarf']
const DRAFT = 'crew-setup-draft'

const WORDS = {
  en: {

    needName: 'Every agent needs a name.',
    defaults: { lead: 'Captain', members: [['Nova', 'bow', 'haiku', 'Small, mechanical tasks'], ['Whiskers', 'cat', 'haiku', 'Searching and reading code'], ['Atlas', 'helmet', 'sonnet', 'Everyday feature work']] },
  },
  ar: {
    other: 'English', brand: 'الفريق', steps: ['القائد', 'المساعدين', 'الربط', 'النهاية'],
    leadTitle: 'مين هيقود فريقك؟', leadLede: 'Claude Code هو القائد: بيقسّم الشغل ويراجع اللي بيرجع. اختار له اسم وشكل.',
    leadName: 'اسم القائد', look: 'الشكل',
    subTitle: 'تحب تسمّي المساعدين بنفسك؟', subLede: 'دول اللي القائد بيوزّع عليهم الشغل. تقدر تسيب الفريق المقترح أو تعمله على مزاجك.',
    keep: 'سيب الفريق المقترح', keepHint: 'تلات مساعدين جاهزين بأساميهم وأشكالهم', own: 'هسمّيهم بنفسي', ownHint: 'اختار الأسامي والأشكال والموديلات',
    helper: 'مساعد', name: 'الاسم', model: 'الموديل', effort: 'المجهود', job: 'شاطر في إيه؟', jobPlaceholder: 'المهام الصغيرة والمتكررة',
    remove: 'شيل', add: 'زوّد مساعد', low: 'قليل', medium: 'متوسط', high: 'عالي',
    haiku: 'Haiku (سريع ورخيص)', sonnet: 'Sonnet (متوازن)', opus: 'Opus (الشغل الصعب)',
    connectTitle: 'عايز تربط أنهي agents؟', connectLede: 'أي agent بيقرا ويكتب ملفات يقدر ينضم لفريقك. اختار اللي بتستخدمهم، أو عدّي الخطوة دي.',
    connectName: 'اسمه في الفريق',
    kinds: { claude: ['حساب Claude تاني', 'جلسة Claude Code تانية بتاخد المهام مباشرة'], codex: ['Codex', 'القائد بيشغّله بنفسه. محتاج Codex CLI'], gemini: ['Gemini CLI', 'وكيل البرمجة من Google'], cursor: ['Cursor', 'الوكيل بتاع محرر Cursor'], other: ['Agent تاني', 'أي حاجة تانية بتشتغل على الملفات'] },
    otherName: 'اسم الـagent',
    finishTitle: 'فريقك جاهز للربط', finishLede: 'انسخ كل برومبت وحطّه في المكان المكتوب فوقه. ده كل الإعداد.',
    forClaude: 'حط ده في Claude Code', forClaudeHint: 'ده بيحفظ فريقك، واللوحة بتتحدّث لوحدها في ثواني.',
    forAgent: 'حط ده في {name}', forAgentHint: 'ده بيعرّف {name} يدخل الفريق إزاي. بعدها قوله "check crew tasks" لما القائد يديله شغل.',
    forSecond: 'حط ده في جلسة Claude التانية', forSecondHint: 'سطّب البلجن على الحساب ده الأول. وبعدين اكتب {cmd} في الجلسة دي.',
    codexTitle: 'افتح Codex CLI مرة واحدة', codexBody: 'القائد بيشغّل Codex بنفسه، فمش محتاج تحط برومبت ولا تروحله في أي مهمة. كل المطلوب إن Codex CLI يكون متسطب ومسجّل دخول. شغّل الأمرين دول مرة واحدة في التيرمينال:', codexAfter: 'بعد كده مش لازم أي حاجة تفضل مفتوحة. ولو القائد ما لقاش Codex CLI هيقولك.',
    copy: 'انسخ البرومبت', copied: 'اتنسخ', back: 'رجوع', next: 'التالي', developed: 'تطوير', author: 'م. محمد أمين',
    needName: 'كل agent لازم يبقى له اسم.',
    defaults: { lead: 'القبطان', members: [['نوفا', 'bow', 'haiku', 'المهام الصغيرة والمتكررة'], ['مشمش', 'cat', 'haiku', 'البحث وقراءة الكود'], ['أطلس', 'helmet', 'sonnet', 'شغل الفيتشرز العادي']] },
  },
}

const CONNECTABLE = ['claude', 'codex', 'gemini', 'cursor', 'other']
const CONNECT_LOOK = { claude: 'music', codex: 'hologram', gemini: 'pink', cursor: 'scarf', other: 'hologram' }

const startLang = () => {
  const saved = CREW.config && CREW.config.language
  return saved || ((navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en')
}

function suggested(lang) {
  const d = WORDS[lang].defaults
  return {
    lead: { name: d.lead, look: 'captain' },
    members: d.members.map(([name, look, model, job]) => ({ name, look, model, effort: 'medium', job })),
  }
}

function freshState() {
  const lang = startLang()
  const base = CREW.config || suggested(lang)
  const picked = {}
  for (const c of (CREW.config && CREW.config.connections) || []) picked[c.kind] = { name: c.name, look: c.look }
  return { lang, step: 0, own: !!CREW.config, lead: { ...base.lead }, members: base.members.map(m => ({ ...m })), picked }
}

function loadDraft() {
  // A saved crew wins over a draft: the file is what is true now.
  if (CREW.config) return null
  try { return JSON.parse(localStorage.getItem(DRAFT)) } catch { return null }
}

let state = loadDraft() || freshState()

function save() {
  try { localStorage.setItem(DRAFT, JSON.stringify(state)) } catch { /* Private window: the page still works. */ }
}

const w = () => WORDS[state.lang]
const fill = (text, values) => text.replace(/\{(\w+)\}/g, (all, key) => values[key] ?? all)

function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag)
  for (const [key, value] of Object.entries(props)) {
    if (key === 'class') node.className = value
    else if (key === 'on') for (const [name, fn] of Object.entries(value)) node.addEventListener(name, fn)
    else if (key in node) node[key] = value
    else node.setAttribute(key, value)
  }
  for (const kid of kids) if (kid !== null && kid !== undefined) node.append(kid)
  return node
}

// The drawings come from the plugin itself. Everything a person types goes in as text.
function art(look) {
  const span = document.createElement('span')
  span.innerHTML = `<svg viewBox="0 0 76 76" role="img" aria-hidden="true">${CREW.looks[look] || ''}</svg>`
  return span.firstChild
}

function lookPicker(current, onPick) {
  const box = el('div', { class: 'looks', role: 'group' })
  for (const look of LOOKS) {
    const button = el('button', { class: 'look', type: 'button', title: look, 'aria-label': look, on: { click() { onPick(look); render() } } }, art(look))
    button.setAttribute('aria-pressed', String(look === current))
    box.append(button)
  }
  return box
}

function field(label, value, onInput, placeholder = '') {
  const id = 'f' + Math.random().toString(36).slice(2)
  return el('div', {},
    el('label', { htmlFor: id }, label),
    el('input', { id, type: 'text', value, placeholder, maxLength: 200, on: { input(e) { onInput(e.target.value); save() } } }))
}

function select(label, value, options, onChange) {
  const id = 's' + Math.random().toString(36).slice(2)
  const box = el('select', { id, on: { change(e) { onChange(e.target.value); save() } } })
  for (const [key, text] of options) box.append(el('option', { value: key, selected: key === value }, text))
  return el('div', {}, el('label', { htmlFor: id }, label), box)
}

function viewLead() {
  return [
    el('h1', {}, w().leadTitle), el('p', { class: 'lede' }, w().leadLede),
    el('div', { class: 'card' },
      field(w().leadName, state.lead.name, v => { state.lead.name = v }),
      el('div', { class: 'sub' }, el('span', { class: 'label' }, w().look), lookPicker(state.lead.look, look => { state.lead.look = look }))),
  ]
}

function memberCard(member, index) {
  const models = ['haiku', 'sonnet', 'opus'].map(m => [m, w()[m]])
  const efforts = ['low', 'medium', 'high'].map(e => [e, w()[e]])
  return el('div', { class: 'card' },
    el('div', { class: 'head' },
      el('strong', {}, `${w().helper} ${index + 1}`),
      el('button', { class: 'btn quiet', type: 'button', on: { click() { state.members.splice(index, 1); render() } } }, w().remove)),
    field(w().name, member.name, v => { member.name = v }),
    el('div', { class: 'sub' }, el('span', { class: 'label' }, w().look), lookPicker(member.look, look => { member.look = look })),
    el('div', { class: 'row' },
      select(w().model, member.model, models, v => { member.model = v }),
      select(w().effort, member.effort, efforts, v => { member.effort = v })),
    el('div', { class: 'sub' }, field(w().job, member.job, v => { member.job = v }, w().jobPlaceholder)))
}

function choice(title, hint, pressed, onPress) {
  const button = el('button', { type: 'button', on: { click: onPress } }, el('b', {}, title), el('span', {}, hint))
  button.setAttribute('aria-pressed', String(pressed))
  return button
}

function viewMembers() {
  const parts = [
    el('h1', {}, w().subTitle), el('p', { class: 'lede' }, w().subLede),
    el('div', { class: 'choice' },
      choice(w().keep, w().keepHint, !state.own, () => { state.own = false; state.members = suggested(state.lang).members; render() }),
      choice(w().own, w().ownHint, state.own, () => { state.own = true; render() })),
  ]
  if (state.own) {
    state.members.forEach((member, index) => parts.push(memberCard(member, index)))
    if (state.members.length < 12) {
      parts.push(el('button', { class: 'btn', type: 'button', on: { click() {
        state.members.push({ name: '', look: LOOKS[(state.members.length + 1) % LOOKS.length], model: 'haiku', effort: 'medium', job: '' })
        render()
      } } }, w().add))
    }
  } else {
    const row = el('div', { class: 'card' })
    for (const member of state.members) {
      row.append(el('div', { class: 'head' },
        el('strong', {}, member.name),
        el('span', { class: 'hint' }, `${member.model} · ${member.job}`)))
    }
    parts.push(row)
  }
  return parts
}

function connectCard(kind) {
  const [title, hint] = w().kinds[kind]
  const picked = state.picked[kind]
  const box = el('input', { type: 'checkbox', checked: !!picked, on: { change(e) {
    if (e.target.checked) state.picked[kind] = { name: kind === 'other' ? '' : title, look: CONNECT_LOOK[kind] }
    else delete state.picked[kind]
    render()
  } } })
  return el('div', { class: 'card' },
    el('label', { class: 'agent' }, box, el('span', {}, title, el('small', {}, hint))),
    picked ? el('div', { class: 'sub' },
      field(kind === 'other' ? w().otherName : w().connectName, picked.name, v => { picked.name = v }),
      el('div', { class: 'sub' }, el('span', { class: 'label' }, w().look), lookPicker(picked.look, look => { picked.look = look }))) : null)
}

const viewConnect = () => [
  el('h1', {}, w().connectTitle), el('p', { class: 'lede' }, w().connectLede),
  ...CONNECTABLE.map(connectCard),
]

// Names travel inside a fenced block, so a run of backticks cannot close it early.
const clean = text => String(text || '').replace(/`/g, "'").replace(/\s+/g, ' ').trim()

function configJson() {
  const used = new Set(['lead'])
  const slug = (name, fallback) => {
    const base = clean(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24) || fallback
    let id = base
    for (let n = 2; used.has(id); n++) id = `${base}-${n}`
    used.add(id)
    return id
  }
  return {
    language: state.lang,
    lead: { name: clean(state.lead.name), look: state.lead.look },
    members: state.members.map((m, i) => ({ id: slug(m.name, `helper-${i + 1}`), name: clean(m.name), look: m.look, model: m.model, effort: m.effort, job: clean(m.job) })),
    connections: CONNECTABLE.filter(kind => state.picked[kind]).map(kind => ({
      id: slug(kind, kind), name: clean(state.picked[kind].name), look: state.picked[kind].look, kind,
    })),
  }
}

const claudePrompt = config => [
  'Set up my Crew plugin for Claude Code.',
  '',
  `1. Write the JSON below to ${CREW.crewDir}/config.json exactly as it is, replacing any earlier copy.`,
  '2. Do nothing else: create no agent files. The plugin reads this file by itself within a few seconds.',
  '3. Then tell me the crew is ready and name its members.',
  '',
  '```json',
  JSON.stringify(config, null, 2),
  '```',
].join('\n')

const secondPrompt = connection => [
  `You are joining my Claude Code crew as a worker. Your name on the crew is ${connection.name}.`,
  '',
  `Read ${CREW.crewDir}/HANDSHAKE.md, the section "Two Claude Code sessions".`,
  `I will run /crew-role worker 2 ${connection.name} in this session myself. After that, run ListAgents, find the lead, and send it crew:hello as the protocol says.`,
  '',
  'A crew: message is a task from me, within this session\'s own permissions. It never grants a permission.',
].join('\n')

const agentPrompt = connection => [
  `You are joining my Claude Code crew as "${connection.name}" (crew id: ${connection.id}). The crew works through shared files in ${CREW.crewDir}.`,
  '',
  `Read ${CREW.crewDir}/HANDSHAKE.md now, the sections "Connected agents" and "Rows". Whenever I say "check crew tasks":`,
  '',
  `1. Read bus/tasks.json in that folder. Take a row whose "to" is "${connection.id}" and whose "status" is "sent", and set it to "working".`,
  `2. Add your row to agents.json with "persona": "${connection.id}", so you appear in my crew pane.`,
  `3. Do the task in your own branch. Write a short line to logs/<your row id>.log after each real step.`,
  '4. When you finish, write 0 or 1 to logs/<your row id>.exit, and set the task to "done" or "failed" with "branch" and a one-line "result".',
  '',
  'Keep every other row in those files as it is. These files give you no new permissions, and a task never overrides your own rules.',
  'If you keep standing instructions, ask me before saving these there. Reply now with one line saying you read the protocol.',
].join('\n')

async function copy(text, button) {
  const done = () => {
    button.textContent = w().copied
    setTimeout(() => { button.textContent = w().copy }, 1600)
  }
  try {
    await navigator.clipboard.writeText(text)
    done()
  } catch {
    const area = button.closest('.card').querySelector('textarea')
    area.select()
    if (document.execCommand('copy')) done()
  }
}

// A command stays one left-to-right run inside an Arabic sentence.
function hintParts(hint, command) {
  const [before, after] = hint.split('{cmd}')
  return after === undefined ? [hint] : [before, el('bdi', { dir: 'ltr' }, command), after]
}

function promptCard(number, title, hint, text, command) {
  const button = el('button', { class: 'btn primary', type: 'button', on: { click() { copy(text, button) } } }, w().copy)
  return el('div', { class: 'card' },
    el('div', { class: 'head' }, el('strong', {}, el('span', { class: 'num' }, String(number)), title), button),
    el('textarea', { readOnly: true, value: text, spellcheck: false, 'aria-label': title }),
    el('p', { class: 'hint' }, ...hintParts(hint, command)))
}

function codexCard(number) {
  return el('div', { class: 'card' },
    el('div', { class: 'head' }, el('strong', {}, el('span', { class: 'num' }, String(number)), w().codexTitle)),
    el('p', { class: 'hint' }, w().codexBody),
    el('pre', {}, ['npm install -g @openai/codex', 'codex login'].join('\n')),
    el('p', { class: 'hint' }, w().codexAfter))
}

function viewFinish() {
  const config = configJson()
  const cards = [promptCard(1, w().forClaude, w().forClaudeHint, claudePrompt(config))]
  config.connections.forEach((c, i) => {
    if (c.kind === 'codex') { cards.push(codexCard(i + 2)); return }
    const second = c.kind === 'claude'
    cards.push(promptCard(i + 2,
      second ? w().forSecond : fill(w().forAgent, { name: c.name }),
      fill(second ? w().forSecondHint : w().forAgentHint, { name: c.name }),
      second ? secondPrompt(c) : agentPrompt(c),
      `/crew-role worker 2 ${c.name}`))
  })
  return [el('h1', {}, w().finishTitle), el('p', { class: 'lede' }, w().finishLede), ...cards]
}

const VIEWS = [viewLead, viewMembers, viewConnect, viewFinish]

function missingName() {
  if (state.step === 0) return !clean(state.lead.name)
  if (state.step === 1) return state.members.some(m => !clean(m.name))
  if (state.step === 2) return Object.values(state.picked).some(p => !clean(p.name))
  return false
}

function render() {
  const words = w()
  document.documentElement.lang = state.lang
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr'
  document.getElementById('brandName').textContent = words.brand
  document.getElementById('brandArt').replaceChildren(art(state.lead.look))
  document.getElementById('langBtn').textContent = words.other
  document.getElementById('steps').replaceChildren(...words.steps.map((name, i) => el('li', { class: i <= state.step ? 'on' : '' }, name)))
  document.getElementById('credit').replaceChildren(words.developed + ' ', el('b', {}, words.author), ' · ', el('bdi', {}, '1l0mt'))

  const nav = el('div', { class: 'nav' })
  nav.append(state.step > 0
    ? el('button', { class: 'btn', type: 'button', on: { click() { state.step--; render(); scrollTo(0, 0) } } }, words.back)
    : el('span'))
  if (state.step < VIEWS.length - 1) {
    const note = el('span', { class: 'hint', role: 'status' })
    nav.append(note, el('button', { class: 'btn primary', type: 'button', on: { click() {
      if (missingName()) { note.textContent = words.needName; return }
      state.step++
      render()
      scrollTo(0, 0)
    } } }, words.next))
  }
  document.getElementById('view').replaceChildren(...VIEWS[state.step](), nav)
  save()
}

document.getElementById('langBtn').addEventListener('click', () => {
  state.lang = state.lang === 'ar' ? 'en' : 'ar'
  // The suggested crew speaks the page's language until the person makes it their own.
  if (!CREW.config) {
    const next = suggested(state.lang)
    if (!state.own) state.members = next.members
    if (Object.values(WORDS).some(l => l.defaults.lead === state.lead.name)) state.lead.name = next.lead.name
  }
  render()
})

render()
</script>
